<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root {
      --bg: #faf7f1;
      --border: #e6dfd1;
      --ink: #23201a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17150f;
        --border: #383327;
        --ink: #ece7dc;
      }
    }
  </style>

  <!-- Editorial ground with subtle hairline -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="var(--bg)" stroke="var(--border)" stroke-width="1.5" />

  <!-- Lowercase 'p' descender stem -->
  <rect x="16" y="14" width="5.5" height="36" rx="2.75" fill="var(--ink)" />

  <!-- Outer bowl of 'p' -->
  <path d="M 21.5 16 H 36 C 44 16 49 21 49 28 C 49 35 44 40 36 40 H 21.5 Z" fill="var(--ink)" />

  <!-- Open book folio counter cutouts -->
  <!-- Left Page -->
  <rect x="24.5" y="20" width="8.5" height="16" rx="1" fill="var(--bg)" />
  <!-- Right Page -->
  <rect x="34.5" y="20" width="9" height="16" rx="1" fill="var(--bg)" />

  <!-- Reading rules in right leaf -->
  <line x1="36.5" y1="24" x2="41.5" y2="24" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
  <line x1="36.5" y1="28" x2="40.5" y2="28" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
  <line x1="36.5" y1="32" x2="41.5" y2="32" stroke="var(--ink)" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
</svg>