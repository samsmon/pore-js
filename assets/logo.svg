<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <style>
    :root {
      --bg: #faf7f1;
      --border: #e6dfd1;
      --ink: #23201a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17150f;
        --border: #383327;
        --ink: #ece7dc;
      }
    }
  </style>

  <!-- Editorial Warm Ground with hairline border -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="var(--bg)" stroke="var(--border)" stroke-width="3" />

  <!-- Lowercase 'p' descender stem -->
  <rect x="64" y="56" width="22" height="144" rx="11" fill="var(--ink)" />

  <!-- Typographic 'p' outer bowl -->
  <path d="M 86 64 H 144 C 176 64 196 84 196 112 C 196 140 176 160 144 160 H 86 Z" fill="var(--ink)" />

  <!-- Open folio counter cutouts (Left & Right facing pages) -->
  <!-- Left Page -->
  <rect x="98" y="80" width="34" height="64" rx="4" fill="var(--bg)" />
  <!-- Right Page -->
  <rect x="138" y="80" width="36" height="64" rx="4" fill="var(--bg)" />

  <!-- Subtle reading rules on left page -->
  <line x1="106" y1="96" x2="124" y2="96" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" opacity="0.3" />
  <line x1="106" y1="112" x2="120" y2="112" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" opacity="0.3" />
  <line x1="106" y1="128" x2="124" y2="128" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" opacity="0.3" />

  <!-- Reading rules on active right page -->
  <line x1="146" y1="96" x2="166" y2="96" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" opacity="0.5" />
  <line x1="146" y1="112" x2="162" y2="112" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" opacity="0.5" />
  <line x1="146" y1="128" x2="166" y2="128" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round" opacity="0.5" />
</svg>